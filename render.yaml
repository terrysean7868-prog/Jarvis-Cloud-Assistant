# Basic Render service configuration - adjust settings via Render dashboard as needed
services:
  - type: web
    name: jarvis-cloud-assistant
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        value: ""
