name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install pytest pytest-asyncio

      - name: Syntax check
        run: python -m compileall -q src apps tests

      - name: Run tests
        env:
          AUTH_USE_DB: "false"
          JARVIS_CLOUD_MODE: "false"
        run: pytest -q
